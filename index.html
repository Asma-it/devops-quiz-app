<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DevOps Quiz App</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>DevOps Quiz App</h1>

    <section class="controls">
      <label for="topicSelect">Select Topic:</label>
      <select id="topicSelect">
        <option value="all">All Topics</option>
      </select>
      <button id="startBtn">Start Quiz</button>
    </section>

    <section id="quizCard" class="card hidden">
      <div class="meta">
        <span id="progressText"></span>
        <span id="topicText"></span>
      </div>

      <h2 id="questionText"></h2>
      <div id="optionsBox" class="options"></div>

      <div id="feedbackBox" class="feedback hidden"></div>

      <div class="actions">
        <button id="nextBtn" class="hidden">Next</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
